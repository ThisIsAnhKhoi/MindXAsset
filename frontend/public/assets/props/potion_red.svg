<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Bubbling Health Potion (Red Flask) -->
  <defs>
    <radialGradient id="redLiquid" cx="40%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#FF5577"/>
      <stop offset="70%" stop-color="#DD0033"/>
      <stop offset="100%" stop-color="#880011"/>
    </radialGradient>
    <radialGradient id="potionGlass" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#AACCFF" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <!-- Wooden Cork Stopper -->
  <polygon points="112,65 144,65 140,82 116,82" fill="#B37D4E" stroke="#5C3B1E" stroke-width="3"/>
  <!-- Bottle Neck -->
  <rect x="115" y="80" width="26" height="25" fill="#E6F0FA" stroke="#2B3A4A" stroke-width="3.5"/>
  <ellipse cx="128" cy="80" rx="16" ry="5" fill="#CCDDEE" stroke="#2B3A4A" stroke-width="3"/>
  <!-- Spherical Bottle Body -->
  <circle cx="128" cy="155" r="60" fill="#F0F8FF" stroke="#2B3A4A" stroke-width="5"/>
  <!-- Red Health Liquid Inside -->
  <path d="M 72,165 A 60,60 0 0,0 184,165 Q 156,155 128,158 Q 100,161 72,165 Z" fill="url(#redLiquid)"/>
  <!-- Bubbles floating up -->
  <circle cx="115" cy="175" r="4" fill="#FFAACC" opacity="0.8"/>
  <circle cx="138" cy="182" r="5" fill="#FFAACC" opacity="0.8"/>
  <circle cx="125" cy="168" r="3" fill="#FFAACC" opacity="0.8"/>
  <circle cx="145" cy="150" r="3.5" fill="#FFAACC" opacity="0.8"/>
  <!-- Glass Reflection Arc -->
  <path d="M 85,130 A 50,50 0 0,1 115,108" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
</svg>
