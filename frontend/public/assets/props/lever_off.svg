<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Dungeon Wall Lever Switch (OFF State - Lever Up) -->
  <defs>
    <linearGradient id="stonePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555E68"/>
      <stop offset="100%" stop-color="#33383F"/>
    </linearGradient>
  </defs>
  <!-- Stone Wall Mount Plate -->
  <rect x="75" y="110" width="106" height="110" rx="8" fill="url(#stonePlate)" stroke="#1A1C20" stroke-width="5"/>
  <!-- Mounting Screws -->
  <circle cx="90" cy="125" r="4" fill="#88929E"/>
  <circle cx="166" cy="125" r="4" fill="#88929E"/>
  <circle cx="90" cy="205" r="4" fill="#88929E"/>
  <circle cx="166" cy="205" r="4" fill="#88929E"/>
  <!-- Status Indicator Light (Red = Inactive/Locked) -->
  <circle cx="128" cy="132" r="7" fill="#FF0044" stroke="#880022" stroke-width="2"/>
  <circle cx="126" cy="130" r="2" fill="#FFFFFF"/>
  <!-- Lever Pivot Base Box -->
  <rect x="108" y="155" width="40" height="35" rx="4" fill="#222" stroke="#111" stroke-width="3"/>
  <!-- Lever Shaft Pointing Up-Right (Off Position) -->
  <line x1="128" y1="172" x2="160" y2="75" stroke="#CBD5E0" stroke-width="10" stroke-linecap="round"/>
  <line x1="128" y1="172" x2="160" y2="75" stroke="#718096" stroke-width="4" stroke-linecap="round"/>
  <!-- Red Grip Knob on Top -->
  <circle cx="162" cy="72" r="14" fill="#DD2233" stroke="#880011" stroke-width="3"/>
  <circle cx="158" cy="68" r="4" fill="#FF8899"/>
</svg>
