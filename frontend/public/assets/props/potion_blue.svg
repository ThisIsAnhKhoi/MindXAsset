<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Glowing Mana Potion (Blue Flask) -->
  <defs>
    <radialGradient id="blueLiquid" cx="40%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#55CCFF"/>
      <stop offset="70%" stop-color="#0066EE"/>
      <stop offset="100%" stop-color="#002277"/>
    </radialGradient>
  </defs>
  <!-- Wooden Cork Stopper -->
  <polygon points="112,65 144,65 140,82 116,82" fill="#B37D4E" stroke="#5C3B1E" stroke-width="3"/>
  <!-- Bottle Neck -->
  <rect x="115" y="80" width="26" height="25" fill="#E6F0FA" stroke="#2B3A4A" stroke-width="3.5"/>
  <ellipse cx="128" cy="80" rx="16" ry="5" fill="#CCDDEE" stroke="#2B3A4A" stroke-width="3"/>
  <!-- Spherical Bottle Body -->
  <circle cx="128" cy="155" r="60" fill="#F0F8FF" stroke="#2B3A4A" stroke-width="5"/>
  <!-- Blue Mana Liquid Inside -->
  <path d="M 72,165 A 60,60 0 0,0 184,165 Q 156,155 128,158 Q 100,161 72,165 Z" fill="url(#blueLiquid)"/>
  <!-- Sparkling Mana Stars inside -->
  <circle cx="118" cy="175" r="3.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="135" cy="180" r="4.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="145" cy="155" r="3" fill="#FFFFFF" opacity="0.9"/>
  <!-- Glass Reflection Arc -->
  <path d="M 85,130 A 50,50 0 0,1 115,108" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
</svg>
