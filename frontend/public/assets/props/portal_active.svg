<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Glowing Dimensional Magic Portal Arch -->
  <defs>
    <linearGradient id="portalRune" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <radialGradient id="portalVortex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
  </defs>
  <!-- Stone Platform Base -->
  <polygon points="45,215 211,215 195,235 61,235" fill="#374151" stroke="#111827" stroke-width="4"/>
  <!-- Swirling Cosmic Vortex Core -->
  <ellipse cx="128" cy="135" rx="55" ry="75" fill="url(#portalVortex)"/>
  <!-- Swirl Spiral Tendrils -->
  <path d="M 128,135 Q 150,90 120,70 Q 90,110 128,135 Z" fill="#C084FC" opacity="0.6"/>
  <path d="M 128,135 Q 106,180 136,200 Q 166,160 128,135 Z" fill="#C084FC" opacity="0.6"/>
  <!-- Ancient Stone Archway Pillars -->
  <path d="M 55,215 L 55,135 C 55,75 201,75 201,135 L 201,215 L 175,215 L 175,135 C 175,98 81,98 81,135 L 81,215 Z" fill="url(#portalRune)" stroke="#111827" stroke-width="5"/>
  <!-- Glowing Magical Runes on Arch -->
  <circle cx="68" cy="170" r="3" fill="#E879F9"/>
  <circle cx="68" cy="140" r="3" fill="#E879F9"/>
  <circle cx="95" cy="85" r="3.5" fill="#E879F9"/>
  <circle cx="128" cy="74" r="4" fill="#E879F9"/>
  <circle cx="161" cy="85" r="3.5" fill="#E879F9"/>
  <circle cx="188" cy="140" r="3" fill="#E879F9"/>
  <circle cx="188" cy="170" r="3" fill="#E879F9"/>
</svg>
